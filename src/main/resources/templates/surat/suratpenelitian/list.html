<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layoutadmin}"
>
	<head>
		<meta charset="UTF-8" />
		<title th:text="${title}">Daftar Surat Penelitian</title>
	</head>
	<body>
		<div layout:fragment="main">
			<!-- Header -->
			<div class="header bg-gradient-primary pb-8 pt-5 pt-md-8">
				<div class="container-fluid">
					<div class="header-body">
						<!-- Card stats -->
						<div class="row">
							<div class="col-xl-12 col-lg-12">
								<div class="card card-stats mb-4 mb-xl-0">
									<div class="card-body">
										<div class="row">
											<div class="col">
												<h5 class="card-title text-uppercase text-muted mb-0">
													Daftar Surat Penelitian
												</h5>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Page content -->
			<div class="container-fluid mt--7">
				<!-- Table -->
				<div class="row">
					<div class="col-xl-12 mb-5 mb-xl-0">
						<div class="card shadow">
							<div class="card-header bg-white border-0">
								<div class="row align-items-center">
									<div class="col-8">
										<h3 class="mb-0">Daftar Surat Penelitian</h3>
									</div>
								</div>
							</div>

							<!-- Filter Form -->
							<div class="card-body border-bottom">
								<form th:action="@{/surat/suratpenelitian/list}" method="get">
									<div class="row">
										<div class="col-md-4">
											<div class="form-group">
												<label for="nim">NIM Mahasiswa</label>
												<input
													type="text"
													class="form-control"
													name="nim"
													id="nim"
													th:value="${nim}"
													placeholder="Masukkan NIM"
												/>
											</div>
										</div>
										<div class="col-md-4">
											<div class="form-group">
												<label for="status">Status Approval</label>
												<select
													class="form-control"
													name="status"
													id="status"
												>
													<option value="">Semua Status</option>
													<option value="WAITING" th:selected="${status == 'WAITING'}">Waiting</option>
													<option value="APPROVED" th:selected="${status == 'APPROVED'}">Approved</option>
													<option value="REJECTED" th:selected="${status == 'REJECTED'}">Rejected</option>
												</select>
											</div>
										</div>
										<div class="col-md-4">
											<div class="form-group">
												<label>&nbsp;</label>
												<div>
													<button type="submit" class="btn btn-primary">
														<i class="fas fa-search"></i> Filter
													</button>
													<a
														th:href="@{/surat/suratpenelitian/list}"
														class="btn btn-secondary"
													>
														<i class="fas fa-redo"></i> Reset
													</a>
												</div>
											</div>
										</div>
									</div>
								</form>
							</div>

							<div class="table-responsive">
								<!-- Projects table -->
								<table class="table align-items-center table-flush">
									<thead class="thead-light">
										<tr>
											<th scope="col">No.</th>
											<th scope="col">Tanggal Pengajuan</th>
											<th scope="col">NIM</th>
											<th scope="col">Nama Mahasiswa</th>
											<th scope="col">Prodi</th>
											<th scope="col">Judul Skripsi</th>
											<th scope="col">Nama Perusahaan</th>
											<th scope="col">Nomor Telepon</th>
											<th scope="col">Status Approval</th>
											<th scope="col">Tanggal Approval</th>
											<th scope="col">Aksi</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="surat, rowStat : ${data}">
											<td th:text="${rowStat.index + 1 + (data.number * data.size)}">-</td>
											<td th:text="${#temporals.format(surat.tanggalDibuat, 'dd-MM-yyyy')}">-</td>
											<td th:text="${surat.mahasiswa.nim}">-</td>
											<td th:text="${surat.mahasiswa.nama}">-</td>
											<td th:text="${surat.mahasiswa.idProdi.namaProdi}">-</td>
											<td th:text="${surat.judulSkripsi}">-</td>
											<td th:text="${surat.namaPerusahaan}">-</td>
											<td th:text="${surat.nomorTelepon}">-</td>
											<td>
												<span
													class="badge badge-warning"
													th:if="${surat.statusApproval == null or surat.statusApproval.name() == 'WAITING'}"
												>
													<i class="fas fa-clock"></i> Waiting
												</span>
												<span
													class="badge badge-success"
													th:if="${surat.statusApproval != null and surat.statusApproval.name() == 'APPROVED'}"
												>
													<i class="fas fa-check"></i> Approved
												</span>
												<span
													class="badge badge-danger"
													th:if="${surat.statusApproval != null and surat.statusApproval.name() == 'REJECTED'}"
												>
													<i class="fas fa-times"></i> Rejected
												</span>
											</td>
											<td>
												<span
													th:if="${surat.statusApproval != null and surat.statusApproval.name() == 'APPROVED' and surat.tanggalApproval != null}"
													th:text="${#temporals.format(surat.tanggalApproval, 'dd-MM-yyyy')}"
												>
													-
												</span>
												<span
													th:if="${surat.statusApproval == null or surat.statusApproval.name() == 'WAITING'}"
													class="text-muted"
												>
													-
												</span>
												<span
													th:if="${surat.statusApproval != null and surat.statusApproval.name() == 'REJECTED'}"
													class="text-danger"
												>
													-
												</span>
											</td>
											<td>
												<a
													th:if="${surat.statusApproval != null and surat.statusApproval.name() == 'APPROVED'}"
													th:href="@{/surat/suratpenelitian/download/{id}(id=${surat.id})}"
													class="btn btn-sm btn-success"
												>
													<i class="fas fa-download"></i>
												</a>
												<form
													th:if="${surat.statusApproval == null or surat.statusApproval.name() == 'WAITING'}"
													th:action="@{/surat/suratpenelitian/approve/{id}(id=${surat.id})}"
													method="post"
													style="display: inline;"
												>
													<button
														type="submit"
														class="btn btn-sm btn-success"
														onclick="return confirm('Approve surat penelitian ini?')"
													>
														<i class="fas fa-check"></i>
													</button>
												</form>
												<form
													th:if="${surat.statusApproval == null or surat.statusApproval.name() == 'WAITING'}"
													th:action="@{/surat/suratpenelitian/reject/{id}(id=${surat.id})}"
													method="post"
													style="display: inline;"
												>
													<button
														type="submit"
														class="btn btn-sm btn-danger"
														onclick="return confirm('Reject surat penelitian ini?')"
													>
														<i class="fas fa-times"></i>
													</button>
												</form>
											</td>
										</tr>
										<tr th:if="${data.isEmpty()}">
											<td colspan="11" class="text-center">Tidak ada data</td>
										</tr>
									</tbody>
								</table>
							</div>

							<!-- Pagination -->
							<div class="card-footer py-4" th:if="${!data.isEmpty()}">
								<nav aria-label="...">
									<ul class="pagination justify-content-end mb-0">
										<li
											class="page-item"
											th:classappend="${!data.hasPrevious() ? 'disabled' : ''}"
										>
											<a
												class="page-link"
												th:href="@{/surat/suratpenelitian/list(page=${data.number - 1}, nim=${nim}, status=${status})}"
												tabindex="-1"
											>
												<i class="fas fa-angle-left"></i>
												<span class="sr-only">Previous</span>
											</a>
										</li>
										<li
											class="page-item"
											th:classappend="${page == data.number ? 'active' : ''}"
											th:each="page : ${#numbers.sequence(0, data.totalPages - 1)}"
										>
											<a
												class="page-link"
												th:href="@{/surat/suratpenelitian/list(page=${page}, nim=${nim}, status=${status})}"
												th:text="${page + 1}"
											>
												1
											</a>
										</li>
										<li
											class="page-item"
											th:classappend="${!data.hasNext() ? 'disabled' : ''}"
										>
											<a
												class="page-link"
												th:href="@{/surat/suratpenelitian/list(page=${data.number + 1}, nim=${nim}, status=${status})}"
											>
												<i class="fas fa-angle-right"></i>
												<span class="sr-only">Next</span>
											</a>
										</li>
									</ul>
								</nav>
							</div>
						</div>
					</div>
				</div>

				<!-- Footer -->
				<footer class="footer">
					<div class="row align-items-center justify-content-xl-between">
						<div class="col-xl-6">
							<div class="copyright text-center text-xl-left text-muted">
								&copy; 2020 <a href="https://www.creative-tim.com" class="font-weight-bold ml-1" target="_blank">Smile</a>
							</div>
						</div>
					</div>
				</footer>
			</div>
		</div>
	</body>
</html>
