<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Tidak Ditemukan - Institut Tazkia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .card-header i {
            font-size: 5rem;
            margin-bottom: 15px;
        }
        .card-body {
            padding: 30px;
            text-align: center;
        }
        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="card-header">
            <i class="fas fa-exclamation-triangle"></i>
            <h2 class="mb-0">Surat Tidak Ditemukan</h2>
        </div>

        <div class="card-body">
            <div class="alert alert-danger">
                <i class="fas fa-times-circle me-2"></i>
                <strong>Maaf!</strong> Surat yang Anda cari tidak ditemukan atau telah dihapus.
            </div>

            <p class="text-muted">
                Pastikan Anda telah memindai QR Code yang benar. Jika masalah berlanjut, silakan hubungi Bagian Akademik Institut Tazkia.
            </p>

            <div class="mt-4">
                <a href="https://smile.tazkia.ac.id" class="btn btn-primary">
                    <i class="fas fa-home me-2"></i>Kembali ke Beranda
                </a>
            </div>
        </div>

        <div class="footer">
            <p class="mb-1">&copy; <span th:text="${#temporals.year(#temporals.createNow())}">2024</span> Institut Tazkia</p>
            <p class="mb-0">Akses pada: <span th:text="${#temporals.format(#temporals.createNow(), 'dd MMMM yyyy HH:mm')}">-</span></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
