<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layoutadmin}"
>
	<head>
		<meta charset="UTF-8" />
		<title>Konversi Nilai</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
	</head>
	<body>
		<div layout:fragment="main">
			<div class="header bg-gradient-primary pb-8 pt-5 pt-md-8">
				<div class="container-fluid">
					<div class="header-body">
						<!-- Card stats -->
						<div class="row">
							<div class="col-xl-12 col-lg-12">
								<div class="card card-stats mb-4 mb-xl-0">
									<div class="card-body">
										<div class="row">
											<div class="col">
												<h5 class="card-title text-uppercase text-muted mb-0">Form</h5>
												<span class="h2 font-weight-bold mb-0">Konversi Nilai </span>
											</div>
											<div class="col-auto">
												<div
													class="icon icon-shape bg-gradient-blue text-white rounded-circle shadow"
												>
													<i class="fas fa-calendar"></i>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="container-fluid mt--7">
				<div class="row">
					<div class="col-md-6 col-xs-12">
						<div class="card shadow">
							<div class="card-header border-0">
								<h3 class="mb-0">Mahasiswa</h3>
							</div>
							<div class="card-body">
								<address>
									<table class="table-responsive table">
										<tr>
											<td>NIM</td>
											<td>:</td>
											<td th:text="${mahasiswa.nim}"></td>
										</tr>
										<tr>
											<td>Angkatan</td>
											<td>:</td>
											<td th:text="${mahasiswa.angkatan}"></td>
										</tr>
										<tr>
											<td>Nama</td>
											<td>:</td>
											<td th:text="${mahasiswa.nama}"></td>
										</tr>
										<tr>
											<td>Prodi</td>
											<td>:</td>
											<td th:text="${mahasiswa.idProdi.namaProdi}"></td>
										</tr>
										<tr>
											<td>Dosen</td>
											<td>:</td>
											<td th:text="${mahasiswa.dosen.karyawan.namaKaryawan}"></td>
										</tr>
									</table>
								</address>
							</div>
						</div>
					</div>
					<div class="col-md-6 col-xs-12">
						<div class="card shadow">
							<div class="card-header border-0">
								<div class="row align-items-center">
									<div class="col">
										<h3 class="mb-0">Form Konversi</h3>
									</div>
									<div class="col text-right">
										<a
											th:href="@{/academic/conversion/list(nim=${mahasiswa.nim})}"
											class="btn btn-sm btn-default"
											><i class="fas fa-arrow-alt-circle-left"></i> Kembali</a
										>
									</div>
								</div>
							</div>
							<div class="card-body">
								<input type="hidden" name="p" id="isiProdi" th:value="${mahasiswa.idProdi.id}" />
								<input type="hidden" name="nim" id="isiMahasiswa" th:value="${mahasiswa.nim}" />

								<div class="row">
									<div class="col-md-6 col-xs-12">
										<div class="form-group">
											<label>Prodi</label>
											<select
												id="prodi"
												class="form-control js-example-placeholder-single"
												onchange="getCurriculum()"
											>
												<option value=""></option>
												<option
													th:each="prodi : ${prodi}"
													th:text="${prodi.namaProdi}"
													th:value="${prodi.id}"
												></option>
											</select>
										</div>
									</div>
									<div class="col-md-6 col-xs-12">
										<div class="form-group">
											<label>Kurikulum</label>
											<select
												id="curriculum"
												class="form-control js-example-placeholder-single"
												onchange="getCourse()"
											>
												<option value=""></option>
											</select>
										</div>
									</div>
								</div>

								<div class="form-group">
									<label>Nama matakuliah</label>
									<select class="form-control js-example-placeholder-single" id="course"></select>
								</div>

								<div class="row">
									<div class="col-md-6 col-xs-12">
										<div class="form-group">
											<label>Nama matakuliah lama</label>
											<input type="text" name="matakuliahLama" class="form-control" />
										</div>
									</div>
									<div class="col-md-6 col-xs-12">
										<div class="form-group">
											<label>Grade nilai akhir</label>
											<select required class="form-control" name="grade" id="">
												<option value=""></option>
												<option
													th:each="data : ${grade}"
													th:text="${data.nama}"
													th:value="${data.nama}"
												></option>
											</select>
										</div>
									</div>
								</div>

								<div class="form-group">
									<div class="alert alert-warning" id="notif" th:if="${gagal != null}">
										<span class="alert-inner--icon"
											><i class="fas fa-exclamation-triangle"></i
										></span>
										<span class="alert-inner--text"
											>Mahasiswa atas nama <text th:text="${mahasiswa.nama}"></text> sudah ada
											matakuliah
											<text
												th:text="${jadwal.matakuliahKurikulum.matakuliah.namaMatakuliah}"
											></text
										></span>
									</div>
									<div class="form-group text-center">
										<button type="button" onclick="saveConversion()" class="btn btn-sm btn-success">
											<i class="fas fa-check-circle"></i> Simpan
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	</body>
</html>
<script>
	function isEmpty(obj) {
		for (var key in obj) {
			if (obj.hasOwnProperty(key)) return false;
		}
		return true;
	}

	$(".js-example-placeholder-single").select2({
		placeholder: "Pilih Salah Satu",
		allowClear: true,
	});

	function getCurriculum() {
		const curriculum = $("#curriculum");
		curriculum.empty().append("<option selected disabled>Pilih Kurikulum</option>");
		$("#course").empty().append("<option selected disabled>Pilih Matakuliah</option>");
		$.getJSON(`/api/prodikurikulum?prodi=${$("#prodi").val()}`, (data) => {
			data.forEach((entry) => curriculum.append(`<option value="${entry.id}">${entry.namaKurikulum}</option>`));
		});
	}

	function getCourse() {
		const course = $("#course");
		course.empty().append("<option selected disabled>Pilih Matakuliah</option>");
		$.getJSON(`/api/matakuliahkurikulum?prodi=${$("#prodi").val()}&kurikulum=${$("#curriculum").val()}`, (data) => {
			data.forEach((entry) =>
				course.append(`<option value="${entry.id}">${entry.matakuliah.namaMatakuliah}</option>`)
			);
		});
	}

	function saveConversion() {
		var token = $("input[name='_csrf']").val();
		const prodi = $("#prodi").val();
		const mahasiswa = $("#isiMahasiswa").val();
		const matakuliahBaru = $("#course").val();
		const matakuliahLama = $('input[name="matakuliahLama"]').val();
		const grade = $('select[name="grade"]').val();

		if (!prodi || !mahasiswa || !matakuliahBaru || !matakuliahLama || !grade) {
			Swal.fire({
				icon: "warning",
				title: "Oops...",
				text: "All fields are required!",
			});
			return false;
		}

		const requestData = {
			prodi: prodi,
			mahasiswa: mahasiswa,
			matakuliah: matakuliahBaru,
			matakuliahLama: matakuliahLama,
			grade: grade,
		};

		$.ajax({
			url: "/api/create-jadwal-konversi",
			type: "POST",
			headers: { "X-CSRF-TOKEN": token },
			contentType: "application/json",
			data: JSON.stringify(requestData),
			success: function (response) {
				Swal.fire({
					icon: response.responseCode === "200" ? "success" : "error",
					title: response.responseCode === "200" ? "Success" : "Error",
					text: response.responseMessage,
				});
				if (response.responseCode === "200") {
					$("#prodi").val("").trigger("change");
					$("#curriculum").val("").trigger("change");
					$("#course").val("").trigger("change");
					$('input[name="matakuliahLama"]').val("");
					$('select[name="grade"]').val("");
					// window.location.href = '/academic/conversion/list?nim=' + mahasiswa;
				}
			},
			error: function (xhr) {
				Swal.fire({
					icon: "error",
					title: "Error",
					text: "Error: " + xhr.responseJSON.responseMessage,
				});
			},
		});

		return false;
	}
</script>
