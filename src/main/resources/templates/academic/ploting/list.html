<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.js"></script>
<script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
	// Initialize Select2 for dosen selection
	function initDosenSelect2() {
		$(".dosen-select").each(function () {
			var $select = $(this);
			if ($select.hasClass("select2-hidden-accessible")) {
				return; // Already initialized
			}

			$select.select2({
				placeholder: "Cari Dosen",
				allowClear: true,
				width: "100%",
				minimumInputLength: 3,
				ajax: {
					url: function (params) {
						return "/select2/lecture?search=" + params.term + "&tahun=" + $("#tahun").val();
					},
					dataType: "json",
					type: "GET",
					delay: 300,
					data: function (params) {
						return { q: params.term };
					},
					processResults: function (data) {
						return {
							results: data.map(function (item) {
								return {
									id: item.id,
									text: item.dosen + " (" + item.total + " SKS)",
									total: item.total,
								};
							}),
						};
					},
				},
			});

			// Bind change event
			$select.off("change.ploting").on("change.ploting", function (e) {
				simpanPloting(this);
			});
		});
	}

	// Initialize Select2 for team selection
	function initTeamSelect2() {
		$(".team-select").each(function () {
			var $select = $(this);
			if ($select.hasClass("select2-hidden-accessible")) {
				return; // Already initialized
			}

			$select.select2({
				placeholder: "Cari Team",
				allowClear: true,
				width: "100%",
				minimumInputLength: 3,
				ajax: {
					url: function (params) {
						return "/select2/lecture?search=" + params.term + "&tahun=" + $("#tahun").val();
					},
					dataType: "json",
					type: "GET",
					delay: 300,
					data: function (params) {
						return { q: params.term };
					},
					processResults: function (data) {
						return {
							results: data.map(function (item) {
								return {
									id: item.id,
									text: item.dosen,
									total: item.total,
								};
							}),
						};
					},
				},
			});

			// Bind change event
			$select.off("change.team").on("change.team", function (e) {
				simpanTeam(this);
			});
		});
	}

	// Get row data from data attributes
	function getRowData(element) {
		var $row = $(element).closest("tr");
		return {
			rowIndex: $row.data("row-index"),
			matkur: $row.data("matkur"),
			course: $row.data("course"),
			kelas: $row.data("kelas"),
			sks: $row.data("sks"),
			validasi: $row.data("validasi"),
			jadwal: $row.data("jadwal"),
			idDosen: $row.data("id-dosen"),
		};
	}

	// Update row data attribute
	function updateRowData($row, key, value) {
		$row.data(key, value);
		$row.attr("data-" + key.replace(/([A-Z])/g, "-$1").toLowerCase(), value);
	}

	// Update all SKS displays for a dosen
	function updateDosenSks(dosenId) {
		if (!dosenId) return;

		const url = "/detail/lecture?search=" + dosenId + "&tahun=" + $("#tahun").val();
		$.getJSON(url, function (data) {
			$(".dosen-sks-" + dosenId).val(data.total);
		});
	}

	// Simpan Ploting - refactored
	function simpanPloting(element) {
		var $select = $(element);
		var rowData = getRowData(element);
		var dosenBaru = $select.val();
		var dosenLama = rowData.idDosen;
		var rowIndex = rowData.rowIndex;
		var $row = $select.closest("tr");

		if (!dosenBaru) return;

		var token = $("input[name='_csrf']").val();
		var url = "/academic/ploting/save";

		// Check SKS limit
		const urlDetailDosen = "/detail/lecture?search=" + dosenBaru + "&tahun=" + $("#tahun").val();
		$.getJSON(urlDetailDosen, function (dosenData) {
			var totalSksBaru = parseInt(dosenData.total || 0) + parseInt(rowData.sks || 0);
			var maksimalSks = parseInt(dosenData.maksimalSks || 999);

			// Allow if Thesis or within limit
			if (totalSksBaru > maksimalSks && rowData.course !== "Thesis") {
				Swal.fire({
					position: "top-end",
					icon: "error",
					title: "Melebihi Batas Maksimal SKS (" + maksimalSks + " SKS)",
					showConfirmButton: false,
					timer: 2000,
				});

				// Reset selection
				if (dosenLama) {
					// Refetch old dosen name
					const urlOld = "/detail/lecture?search=" + dosenLama + "&tahun=" + $("#tahun").val();
					$.getJSON(urlOld, function (oldData) {
						var newOption = new Option(oldData.nama, dosenLama, true, true);
						$select.empty().append(newOption).trigger("change.select2");
					});
				} else {
					$select.val(null).trigger("change.select2");
				}
				return;
			}

			// Prepare request data
			var requestData = {
				matakuliah: rowData.matkur,
				kelas: rowData.kelas,
				idDosen: dosenBaru,
			};

			// If already has jadwal, include id for update
			if (rowData.jadwal) {
				requestData.id = rowData.jadwal;
			}

			$.ajax({
				url: url + "?tahun=" + $("#tahun").val(),
				contentType: "application/json;charset=UTF-8",
				headers: { "X-CSRF-TOKEN": token },
				method: "post",
				dataType: "JSON",
				data: JSON.stringify(requestData),
				success: function (response) {
					Swal.fire({
						position: "top-end",
						icon: "success",
						title: "Data Ploting tersimpan",
						showConfirmButton: false,
						timer: 2000,
					});

					// Update row data
					updateRowData($row, "jadwal", response.id);
					updateRowData($row, "id-dosen", dosenBaru);

					// Update SKS input class and value
					var $sksInput = $("#total-sks-" + rowIndex);
					$sksInput.removeClass(function (index, className) {
						return (className.match(/(^|\s)dosen-sks-\S+/g) || []).join(" ");
					});
					$sksInput.addClass("dosen-sks-" + dosenBaru);
					$sksInput.data("id-dosen", dosenBaru);

					// Enable team select
					var $teamSelect = $("#team-select-" + rowIndex);
					$teamSelect.prop("disabled", false);

					// Update SKS for both old and new dosen
					updateDosenSks(dosenBaru);
					if (dosenLama && dosenLama !== dosenBaru) {
						updateDosenSks(dosenLama);
					}
				},
				error: function (xhr) {
					Swal.fire({
						position: "top-end",
						icon: "error",
						title: "Gagal menyimpan data",
						showConfirmButton: false,
						timer: 2000,
					});
				},
			});
		});
	}

						timer: 2000,
					});

			});

	});
