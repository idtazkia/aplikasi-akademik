<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	layout:decorate="~{layoutadmin}"
>
	<head>
		<meta charset="UTF-8" />
		<title>Title</title>
		<style>
			.is-invalid {
				border-color: #dc3545 !important;
				box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
			}
			.error-message {
				font-size: 0.875rem;
				margin-top: 0.25rem;
				color: #dc3545 !important;
			}
		</style>
	</head>
	<body>
		<div layout:fragment="main">
			<div class="header bg-gradient-primary pb-8 pt-5 pt-md-8">
				<div class="container-fluid">
					<div class="header-body">
						<!-- Card stats -->
						<div class="row">
							<div class="col-xl-12 col-lg-12">
								<div class="card card-stats mb-4 mb-xl-0">
									<div class="card-body">
										<div class="row">
											<div class="col">
												<h5 class="card-title text-uppercase text-muted mb-0">Form</h5>
												<span class="h2 font-weight-bold mb-0">Detail Tahun Akademik </span>
											</div>
											<div class="col-auto">
												<div
													class="icon icon-shape bg-gradient-blue text-white rounded-circle shadow"
												>
													<i class="fas fa-calendar"></i>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="container-fluid mt--7">
				<!-- Table -->
				<div class="row">
					<div class="col">
						<div class="card shadow">
							<div class="card-header border-0">
								<div class="row align-items-center">
									<div class="col">
										<h3 class="mb-0">Data List</h3>
									</div>
									<div class="col text-right">
										<a th:href="@{/academic/year/prodi/list}" class="btn btn-sm btn-default"
											><i class="fas fa-arrow-alt-circle-left"></i> Back</a
										>
									</div>
								</div>
							</div>
							<div class="card-body">
								<div class="row">
									<div class="col-md-6">
										<div class="form-group"></div>
									</div>
									<div class="col-md-6">
										<div class="form-group"></div>
									</div>
								</div>
								<form method="post" th:action="@{/academic/year/prodi/edit}" th:object="${detail}">
									<div class="row">
										<div class="col-md-6">
											<div class="form-group">
												<label>KRS Start Date</label>
												<input
													type="date"
													name="tanggalMulaiKrs"
													th:field="*{tanggalMulaiKrs}"
													class="form-control"
													placeholder="ex : 2024-01-15"
												/>
											</div>
										</div>
										<div class="col-md-6">
											<div class="form-group">
												<label>KRS End Date</label>
												<input
													type="date"
													name="tanggalSelesaiKrs"
													th:field="*{tanggalSelesaiKrs}"
													placeholder="ex : 2024-01-31"
													class="form-control"
												/>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-md-6">
											<div class="form-group">
												<label>Study Start Date</label>
												<input
													type="date"
													name="tanggalMulaiKuliah"
													th:field="*{tanggalMulaiKuliah}"
													class="form-control"
													placeholder="ex : 2024-02-01"
												/>
											</div>
										</div>
										<div class="col-md-6">
											<div class="form-group">
												<label>Study End Date</label>
												<input
													type="date"
													name="tanggalSelesaiKuliah"
													th:field="*{tanggalSelesaiKuliah}"
													placeholder="ex : 2024-07-15"
													class="form-control"
												/>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-md-6">
											<div class="form-group">
												<label>Mid Term Exam Start Date (UTS)</label>
												<input
													type="date"
													name="tanggalMulaiUts"
													th:field="*{tanggalMulaiUts}"
													class="form-control"
													placeholder="ex : 2024-04-01"
												/>
											</div>
										</div>
										<div class="col-md-6">
											<div class="form-group">
												<label>Mid Term Exam End Date (UTS)</label>
												<input
													type="date"
													name="tanggalSelesaiUts"
													th:field="*{tanggalSelesaiUts}"
													placeholder="ex : 2024-04-15"
													class="form-control"
												/>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-md-6">
											<div class="form-group">
												<label>Final Exam Start Date (UAS)</label>
												<input
													type="date"
													class="form-control"
													name="tanggalMulaiUas"
													th:field="*{tanggalMulaiUas}"
													placeholder="ex : 2024-06-01"
												/>
											</div>
										</div>
										<div class="col-md-6">
											<div class="form-group">
												<label>Final Exam End Date (UAS)</label>
												<input
													type="date"
													placeholder="ex : 2024-06-15"
													name="tanggalSelesaiUas"
													th:field="*{tanggalSelesaiUas}"
													class="form-control"
												/>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-md-6">
											<div class="form-group">
												<label>Grade Entry Start Date</label>
												<input
													type="date"
													class="form-control"
													name="tanggalMulaiNilai"
													th:field="*{tanggalMulaiNilai}"
													placeholder="ex : 2024-06-16"
												/>
											</div>
										</div>
										<div class="col-md-6">
											<div class="form-group">
												<label>Grade Entry End Date</label>
												<input
													type="date"
													placeholder="ex : 2024-07-31"
													name="tanggalSelesaiNilai"
													th:field="*{tanggalSelesaiNilai}"
													class="form-control"
												/>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-md-6">
											<div class="form-group">
												<label>Prodi</label>
												<input
													type="text"
													name="namaProdi"
													readonly
													th:value="${prodi.namaProdi}"
													class="form-control"
												/>
												<input
													type="hidden"
													name="prodi"
													id="prodi"
													th:value="${prodi.id}"
													class="form-control"
												/>
											</div>
										</div>
										<div class="col-md-6">
											<div class="form-group">
												<label>Program</label>
												<select
													class="form-control"
													name="program"
													id="programSelect"
													th:field="*{program}"
												>
													<option value="">-- Semua Program --</option>
													<option
														th:each="program : ${programList}"
														th:value="${program.id}"
														th:text="${program.namaProgram}"
													></option>
												</select>
												<small class="form-text text-muted">
													Pilih "Semua Program" untuk membuat aturan yang berlaku untuk semua
													program di prodi ini
												</small>
											</div>
										</div>
									</div>

									<div class="row">
										<div class="col-md-6">
											<div class="form-group">
												<label>Angkatan Mulai</label>
												<select
													name="angkatanMulai"
													th:field="*{angkatanMulai}"
													class="form-control"
												>
													<option value="">-</option>
													<option
														th:each="angkatan: ${angkatanList}"
														th:value="${angkatan}"
														th:text="${angkatan}"
													></option>
												</select>
											</div>
										</div>
										<div class="col-md-6">
											<div class="form-group">
												<label>Angkatan Selesai</label>
												<select
													name="angkatanSelesai"
													th:field="*{angkatanSelesai}"
													class="form-control"
												>
													<option value="">-</option>
													<option
														th:each="angkatan: ${angkatanList}"
														th:value="${angkatan}"
														th:text="${angkatan}"
													></option>
												</select>
											</div>
										</div>
									</div>
									<input type="hidden" name="id" th:field="*{id}" />
									<input type="hidden" name="tahunAkademik" th:value="${tahunAkademik.id}" />
									<input type="hidden" name="status" th:field="*{status}" />
									<input type="hidden" name="prioritas" th:field="*{prioritas}" />
									<input type="hidden" name="keterangan" th:field="*{keterangan}" />
									<div class="form-group">
										<button type="submit" class="btn btn-primary" id="submitBtn">Save</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
				<!-- Dark table -->
			</div>
	</div>
	<script th:inline="javascript">
	document.addEventListener("DOMContentLoaded", function () {
		// Function to load available angkatan based on prodi and program selection
		function loadAvailableAngkatan() {
			const prodiSelect = document.getElementById("prodi");
			const programSelect = document.getElementById("programSelect");
			const angkatanMulaiSelect = document.querySelector('select[name="angkatanMulai"]');
			const angkatanSelesaiSelect = document.querySelector('select[name="angkatanSelesai"]');

			if (!prodiSelect || !angkatanMulaiSelect || !angkatanSelesaiSelect) {
				console.log("Required select elements not found");
				return;
			}

			const prodiId = prodiSelect.value;
			const programId = programSelect ? programSelect.value : "";

			console.log("Loading angkatan for prodi:", prodiId, "program:", programId);

			if (!prodiId) {
				angkatanMulaiSelect.innerHTML = '<option value="">-</option>';
				angkatanSelesaiSelect.innerHTML = '<option value="">-</option>';
				return;
			}

			// Build URL with parameters
			let url = "/academic/year/prodi/available-angkatan?prodiId=" + prodiId;
			if (programId) {
				url += "&programId=" + programId;
			}

			console.log("Fetching from URL:", url);

			// Make AJAX request
			fetch(url)
				.then((response) => {
					console.log("Response status:", response.status);
					if (!response.ok) {
						throw new Error("Network response was not ok");
					}
					return response.json();
				})
				.then((data) => {
					console.log("Received angkatan data:", data);

					// Save current selected values
					const currentAngkatanMulai = angkatanMulaiSelect.value;
					const currentAngkatanSelesai = angkatanSelesaiSelect.value;

					// Clear current options
					angkatanMulaiSelect.innerHTML = '<option value="">-</option>';
					angkatanSelesaiSelect.innerHTML = '<option value="">-</option>';

					// Add new options
					data.forEach((angkatan) => {
						const optionMulai = document.createElement("option");
						optionMulai.value = angkatan;
						optionMulai.textContent = angkatan;
						angkatanMulaiSelect.appendChild(optionMulai);

						const optionSelesai = document.createElement("option");
						optionSelesai.value = angkatan;
						optionSelesai.textContent = angkatan;
						angkatanSelesaiSelect.appendChild(optionSelesai);
					});

					// Restore previously selected values if they still exist in the new options
					if (currentAngkatanMulai && data.includes(parseInt(currentAngkatanMulai))) {
						angkatanMulaiSelect.value = currentAngkatanMulai;
					}
					if (currentAngkatanSelesai && data.includes(parseInt(currentAngkatanSelesai))) {
						angkatanSelesaiSelect.value = currentAngkatanSelesai;
					}
				})
				.catch((error) => {
					console.error("Error loading angkatan:", error);
					angkatanMulaiSelect.innerHTML = '<option value="">Error loading angkatan</option>';
					angkatanSelesaiSelect.innerHTML = '<option value="">Error loading angkatan</option>';
				});
		}

		// Add event listeners for dynamic angkatan loading
		const programSelect = document.getElementById("programSelect");

		if (programSelect) {
			programSelect.addEventListener("change", loadAvailableAngkatan);
		}
	});
	</script>
</body>
</html>
