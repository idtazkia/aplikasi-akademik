<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	layout:decorate="~{layoutadmin}"
>
	<head>
		<meta charset="UTF-8" />
		<title>Report EDOM</title>
	</head>
	<body>
		<div layout:fragment="main">
			<div class="header bg-gradient-primary pb-8 pt-5 pt-md-8">
				<div class="container-fluid">
					<div class="header-body">
						<!-- Card stats -->
						<div class="row">
							<div class="col-xl-12 col-lg-12">
								<div class="card card-stats mb-4 mb-xl-0">
									<div class="card-body">
										<div class="row">
											<div class="col">
												<h5 class="card-title text-uppercase text-muted mb-0">List</h5>
												<span class="h2 font-weight-bold mb-0">Report EDOM</span>
											</div>
											<div class="col-auto">
												<div
													class="icon icon-shape bg-gradient-blue text-white rounded-circle shadow"
												>
													<i class="fas fa-user-astronaut"></i>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="container-fluid mt--7">
				<div class="row">
					<div class="col">
						<div class="card shadow">
							<div class="card-header border-0">
								<h3 class="mb-0">Data</h3>
							</div>
							<div class="card-body">
								<form method="get">
									<div class="row">
										<div class="col-md-12">
											<div class="form-group text-center">
												<label>Semester</label>
												<select
													class="form-control js-example-placeholder-single"
													style="width: 100% !important"
													name="tahunAkademik"
												>
													<option value=""></option>
													<option
														th:each="data : ${listTahunAkademik}"
														th:selected="(${data} == *{tahunAkademik})"
														th:text="${data.namaTahunAkademik}"
														th:value="${data.id}"
													>
														sdasd
													</option>
												</select>
											</div>
										</div>
										<div class="col-md-12 text-center">
											<button type="submit" class="btn btn-info">Search</button>
										</div>
									</div>
								</form>
							</div>
							<div class="card-footer" th:if="${tahunAkademik != null}">
								<div class="card shadow" th:each="entry : ${rekapEdom}" style="margin: 10px 0">
									<div class="card-header border-0">
										<div class="row align-items-center">
											<div class="col">
												<h3 class="mb-0">
													<i class="fas fa-user"></i> &nbsp;
													<span th:text="${entry.value[0].namaDosen}">Nama Dosen</span>
												</h3>
											</div>
										</div>
									</div>
									<div class="table-responsive">
										<table class="table align-items-center table-flush">
											<thead class="thead-light">
												<tr>
													<th>Matakuliah</th>
													<th>Total Mahasiswa</th>
													<th>Mengisi</th>
													<th>Rata-rata</th>
													<th></th>
												</tr>
											</thead>
											<tbody th:each="data : ${entry.value}">
												<tr>
													<td th:text="${data.namaMatakuliah}">Matakuliah</td>
													<td th:text="${data.totalMahasiswa}">0</td>
													<td th:text="${data.totalMengisi}">0</td>
													<td th:text="${data.rataRata}">0.00</td>
													<td>
														<a
															th:href="@{/report/edom/lecture/detail(id=${data.id})}"
															class="btn btn-sm btn-primary"
															>Detail</a
														>
													</td>
												</tr>
											</tbody>
										</table>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
