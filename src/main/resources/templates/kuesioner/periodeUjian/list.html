<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layoutadmin}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="main">
    <div class="header bg-gradient-primary pb-8 pt-5 pt-md-8">
        <div class="container-fluid">
            <div class="header-body">
                <!-- Card stats -->
                <div class="row">
                    <div class="col-xl-12 col-lg-12">
                        <div class="card card-stats mb-4 mb-xl-0">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col">
                                        <h5 class="card-title text-uppercase text-muted mb-0">List</h5>
                                        <span class="h2 font-weight-bold mb-0">Periode Test </span>
                                    </div>
                                    <div class="col-auto">
                                        <div class="icon icon-shape bg-gradient-blue text-white rounded-circle shadow">
                                            <i class="fas fa-calendar"></i>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid mt--7">
        <div class="row">
            <div class="col">
                <div class="card shadow">
                    <div class="card-header border-0">
                        <div class="row align-items-center">
                            <div class="col">
                                <h3 class="mb-0">Data List</h3>
                            </div>
                            <div class="col text-right">
                                <button data-toggle="modal" data-target="#exampleModal" class="btn btn-sm btn-default">
                                    <i class="fas fa-plus-circle"></i> Tambah
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog"
                         aria-labelledby="exampleModalLabel" aria-hidden="true">
                        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
                            <div class="modal-content">
                                <form th:action="@{/kuesioner/periodeUjian/submit}" method="post">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="exampleModalLabel">Tambah Periode</h5>
                                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                            <span aria-hidden="true">&times;</span>
                                        </button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="row">
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label>Tanggal Mulai</label>
                                                    <input type="date" id="tanggal" name="tanggalUjian" class="form-control">
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label>Kuota</label>
                                                    <input type="text" id="kuota" name="kuota" class="form-control">
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label>Jenis Test</label>
                                                    <select name="jenisTest" id="jenis" class="form-control">
                                                        <option value="TOEFL">TOEFL</option>
                                                        <option value="IELTS">IELTS</option>
                                                    </select>
                                                </div>
                                                <input type="hidden" id="id" name="id">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close
                                        </button>
                                        <button type="submit" class="btn btn-primary">Save changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table align-items-center table-flush">
                            <thead class="thead-light">
                            <tr>
                                <th>No</th>
                                <th>Tanggal Ujian</th>
                                <th>Kuota</th>
                                <th>Jenis</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="data, row :${listPeriode}">
                                <td th:text="${(row.index + 1) + (listPeriode.number * listPeriode.size)}">01</td>
                                <td th:text="${#temporals.format(data.tanggalUjian, 'dd - MMM - yyyy')}"></td>
                                <td th:text="${data.kuota}">Campus Code</td>
                                <td th:text="${data.jenisTest}">Campus Code</td>
                                <td th:text="${data.status}">Campus Code</td>
                                <td>
                                    <button th:if="${data.status == data.status.AKTIF}" onclick="editPeriode(this.getAttribute('data-id'), this.getAttribute('data-tanggal'), this.getAttribute('data-kuota'), this.getAttribute('data-jenis'))"
                                            th:attr="data-id=${data.id}, data-tanggal=${data.tanggalUjian}, data-kuota=${data.kuota}, data-jenis=${data.jenisTest}" class="btn btn-primary btn-sm"><i class="fas fa-edit"></i></button>

                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer py-4">
                        <nav aria-label="...">
                            <ul class="pagination justify-content-end mb-0" sd:pagination="full">
                                <li class="disabled"><a href="#" aria-label="Previous"><span
                                        aria-hidden="true">&laquo;</span></a>
                                </li>
                                <li class="active"><a href="#">1 <span class="sr-only">(current)</span></a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
<script>
    function editPeriode(id,tanggal,kuota,jenis) {
        $('#exampleModal').modal('show')
        document.getElementById('id').value = id;
        document.getElementById('tanggal').value = tanggal;
        document.getElementById('kuota').value = kuota;
        document.getElementById('jenis').value = jenis;
        console.log('id :' + id, 'tanggal : ' + tanggal,'kuota : ' + kuota)

    }
</script>
