<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layoutadmin}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="main">
    <div class="header bg-gradient-primary pb-8 pt-5 pt-md-8">
        <div class="container-fluid">
            <div class="header-body">
                <!-- Card stats -->
                <div class="row">
                    <div class="col-xl-12 col-lg-12">
                        <div class="card card-stats mb-4 mb-xl-0">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col">
                                        <h5 class="card-title text-uppercase text-muted mb-0">Form</h5>
                                        <span class="h2 font-weight-bold mb-0">Value of bill type </span>
                                    </div>
                                    <div class="col-auto">
                                        <div class="icon icon-shape bg-gradient-blue text-white rounded-circle shadow">
                                            <i class="fas fa-calendar"></i>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid mt--7">
        <div class="row">
            <div class="col-md-6 col-xs-12">
                <div class="card shadow">
                    <div class="card-header border-0">
                        <h3 class="mb-0">Form</h3>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info mb-3" id="referenceInfo" style="display: none;">
                            <i class="fas fa-info-circle"></i> Data berhasil diambil dari semester sebelumnya: <strong id="previousTahunName"></strong>
                        </div>

                        <div class="form-group mb-3">
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="copyFromPrevious">
                                <label class="custom-control-label" for="copyFromPrevious">Copy data dari semester sebelumnya</label>
                            </div>
                        </div>

                        <div id="referenceOptions" style="display: none;">
                            <div class="card bg-light mb-3">
                                <div class="card-body">
                                    <h6 class="card-title">Opsi Referensi</h6>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label>Prodi (opsional)</label>
                                            <select id="refProdi" class="form-control form-control-sm">
                                                <option value="">Semua Prodi</option>
                                                <option th:each="data : ${prodi}"
                                                        th:text="${data.namaProdi}"
                                                        th:value="${data.id}">STEI TAZKIA</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label>Program (opsional)</label>
                                            <select id="refProgram" class="form-control form-control-sm">
                                                <option value="">Semua Program</option>
                                                <option th:each="data : ${program}"
                                                        th:text="${data.namaProgram}"
                                                        th:value="${data.id}">STEI TAZKIA</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-md-6">
                                            <label>Angkatan (opsional)</label>
                                            <select id="refAngkatan" class="form-control form-control-sm">
                                                <option value="">Semua Angkatan</option>
                                                <option th:each="data : ${angkatan}"
                                                        th:text="${data}"
                                                        th:value="${data}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 d-flex align-items-end">
                                            <button type="button" id="loadReference" class="btn btn-sm btn-primary">
                                                <i class="fas fa-download"></i> Load Data Referensi
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <form method="post" th:action="@{/studentBill/valueType/new}"  th:object="${valueBill}">
                            <div class="form-group">
                                <label>Type of bill</label>
                                <select name="" required id="jenisTagihan" class="form-control" th:field="*{jenisTagihan}">
                                    <option value=""></option>
                                    <option th:each="data : ${jenisTagihan}"
                                            th:text="${data.kode + ' - ' +data.nama}"
                                            th:value="${data.id}">STEI TAZKIA</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Academic Year</label>
                                <select name="" required id="" class="form-control" th:field="*{tahunAkademik}">
                                    <option value=""></option>
                                    <option th:each="data : ${tahunAkademik}"
                                            th:text="${data.namaTahunAkademik}"
                                            th:value="${data.id}">STEI TAZKIA</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Prodi</label>
                                <select name="" required id="prodi" class="form-control" th:field="*{prodi}">
                                    <option value=""></option>
                                    <option th:each="data : ${prodi}"
                                            th:text="${data.namaProdi}"
                                            th:value="${data.id}">STEI TAZKIA</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Program</label>
                                <select name="" required id="program" class="form-control" th:field="*{program}">
                                    <option value=""></option>
                                    <option th:each="data : ${program}"
                                            th:text="${data.namaProgram}"
                                            th:value="${data.id}">STEI TAZKIA</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Value</label>
                                <input type="text" name="nilai" class="form-control"
                                       placeholder="0.00" th:field="*{nilai}">
                            </div>

                            <div class="form-group">
                                <label>Batch</label>
                                <select name="" required id="angkatan" class="form-control" th:field="*{angkatan}">
                                    <option value=""></option>
                                    <option th:each="data : ${angkatan}"
                                            th:text="${data}"
                                            th:selected="(${data} == *{angkatan})"
                                            th:value="${data}"></option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label >Kode Jurnal Tagihan</label>
                                <select name="" required class="form-control js-example-placeholder-single" th:field="*{kodeTagihan}">
                                    <option value=""></option>
                                    <option th:each="data : ${template}"
                                            th:text="${data.code + ' - ' + data.name}"
                                            th:value="${data.code}">STEI TAZKIA</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Kode Jurnal Pembayaran Yayasan</label>
                                <select name="" required class="form-control js-example-placeholder-single" th:field="*{kodePembayaranYys}">
                                    <option value=""></option>
                                    <option th:each="data : ${template}"
                                            th:text="${data.code + ' - ' + data.name}"
                                            th:value="${data.code}">STEI TAZKIA</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Kode Jurnal Pembayaran IAI Tazkia</label>
                                <select name="" required class="form-control js-example-placeholder-single" th:field="*{kodePembayaranInst}">
                                    <option value=""></option>
                                    <option th:each="data : ${template}"
                                            th:text="${data.code + ' - ' + data.name}"
                                            th:value="${data.code}">STEI TAZKIA</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Status</label><br>
                                <label>
                                    <input name="status" th:field="*{status}" type="checkbox" value="AKTIF" class="js-switch" />
                                </label >
                            </div>
                            <input type="hidden" name="id" th:field="*{id}">
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary">Save</button>
                                <a th:href="@{/studentBill/valueType/list}" class="btn btn-danger">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
<script>
    $(".js-example-placeholder-single").select2({
        placeholder: "Pilih Salah Satu",
        allowClear: true
    });

    // Toggle reference options
    $('#copyFromPrevious').change(function() {
        if ($(this).is(':checked')) {
            $('#referenceOptions').show();
        } else {
            $('#referenceOptions').hide();
            $('#referenceInfo').hide();
        }
    });

    // Load reference data
    $('#loadReference').click(function() {
        var tahunAkademikId = $('#tahunAkademik').val();
        var prodiId = $('#refProdi').val() || undefined;
        var programId = $('#refProgram').val() || undefined;
        var angkatan = $('#refAngkatan').val() || undefined;

        if (!tahunAkademikId) {
            alert('Silakan pilih Tahun Akademik terlebih dahulu');
            return;
        }

        var url = '/studentBill/valueType/references?tahunAkademikId=' + tahunAkademikId;
        if (prodiId) url += '&prodiId=' + prodiId;
        if (programId) url += '&programId=' + programId;
        if (angkatan) url += '&angkatan=' + angkatan;

        $(this).prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Loading...');

        $.get(url, function(response) {
            $('#loadReference').prop('disabled', false).html('<i class="fas fa-download"></i> Load Data Referensi');

            if (response.success) {
                $('#previousTahunName').text(response.previousTahun.namaTahunAkademik);
                $('#referenceInfo').show();

                // Store reference data for auto-fill
                window.referenceData = response.referenceData;

                // Auto-fill when user selects jenis tagihan
                setupAutoFill();

            } else {
                alert(response.message || 'Gagal mengambil data referensi');
            }
        }).fail(function() {
            $('#loadReference').prop('disabled', false).html('<i class="fas fa-download"></i> Load Data Referensi');
            alert('Terjadi kesalahan saat mengambil data referensi');
        });
    });

    function setupAutoFill() {
        $('#jenisTagihan').off('change').on('change', function() {
            var selectedJenisTagihan = $(this).val();

            if (window.referenceData && selectedJenisTagihan) {
                var matchingData = window.referenceData.find(function(item) {
                    return item.jenisTagihan.id === selectedJenisTagihan;
                });

                if (matchingData) {
                    // Auto-fill nilai
                    $('#nilai').val(matchingData.nilai);

                    // Auto-fill kode jurnal (kembali ke select2 dropdown)
                    $('#kodeTagihan').val(matchingData.kodeTagihan).trigger('change');
                    $('#kodePembayaranYys').val(matchingData.kodePembayaranYys).trigger('change');
                    $('#kodePembayaranInst').val(matchingData.kodePembayaranInst).trigger('change');

                    // Auto-fill prodi, program, dan angkatan
                    if (matchingData.prodi && matchingData.prodi.id) {
                        $('#prodi').val(matchingData.prodi.id);
                        $('#prodi').trigger('change');
                    }

                    if (matchingData.program && matchingData.program.id) {
                        $('#program').val(matchingData.program.id);
                        $('#program').trigger('change');
                    }

                    if (matchingData.angkatan) {
                        $('#angkatan').val(matchingData.angkatan);
                        $('#angkatan').trigger('change');
                    }

                    // Show notification
                    showAutoFillNotification(matchingData);
                }
            }
        });
    }

    function showAutoFillNotification(data) {
        // Remove existing notification
        $('#autoFillNotification').remove();

        var details = [];

        if (data.prodi && data.prodi.namaProdi) {
            details.push('Prodi: ' + data.prodi.namaProdi);
        } else if (data.prodi) {
            details.push('Prodi: ' + data.prodi.nama);
        }

        if (data.program && data.program.namaProgram) {
            details.push('Program: ' + data.program.namaProgram);
        } else if (data.program) {
            details.push('Program: ' + data.program.nama);
        }

        if (data.angkatan) {
            details.push('Angkatan: ' + data.angkatan);
        }

        var message = 'Data telah diisi otomatis dari semester sebelumnya:';
        if (details.length > 0) {
            message += '<br><small>' + details.join(' | ') + '</small>';
        }

        $('form').prepend('<div id="autoFillNotification" class="alert alert-success alert-dismissible fade show mb-3">' +
            '<i class="fas fa-check-circle"></i> ' + message + '. Silakan periksa kembali nilainya.' +
            '<button type="button" class="close" data-dismiss="alert">' +
            '<span>&times;</span>' +
            '</button>' +
            '</div>');
    }
</script>
