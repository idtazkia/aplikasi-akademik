<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layoutadmin}">
<head>
    <meta charset="UTF-8">
    <title>Approval KRS</title>
</head>
<body>
<div layout:fragment="main">
    <div class="header bg-gradient-primary pb-8 pt-5 pt-md-8">
        <div class="container-fluid">
            <div class="header-body">
                <!-- Card stats -->
                <div class="row">
                    <div class="col-xl-12 col-lg-12">
                        <div class="card card-stats mb-4 mb-xl-0">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col">
                                        <h5 class="card-title text-uppercase text-muted mb-0">List</h5>
                                        <span class="h2 font-weight-bold mb-0">Krs </span>
                                    </div>
                                    <div class="col-auto">
                                        <div class="icon icon-shape bg-gradient-blue text-white rounded-circle shadow">
                                            <i class="fas fa-calendar"></i>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid mt--7">
        <!-- Table -->
        <div class="row">
            <div class="col">
                <div class="card shadow">
                    <div class="card-header border-0">
                        <div class="row align-items-center">
                            <div class="col">
                                <h3 class="mb-0">Data List Tahun Akademik <div th:text="${tahun.namaTahunAkademik}"></div></h3>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-items-center table-flush">
                            <thead class="thead-light">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">NIM</th>
                                <th scope="col">Nama</th>
                                <th scope="col">Prodi</th>
                                <th scope="col">Angkatan</th>
                                <th scope="col" width="30px;"></th>
                                <th scope="col"></th>

                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="data,row : ${listKrs}">
                                <td th:text="${(row.index + 1) + (listKrs.number * listKrs.size)}">1</td>
                                <td th:text="${data.mahasiswa.nim}">12</td>
                                <td th:text="${data.mahasiswa.nama}">12</td>
                                <td th:text="${data.mahasiswa.idProdi.namaProdi}">2020</td>
                                <td th:text="${data.mahasiswa.angkatan}">2020</td>
                                <td th:if="${data.status == data.status.WAITING}">
                                    <button type="button" class="btn btn-primary btn-sm">WAITING</button>
                                </td>
                                <td th:if="${data.status == data.status.APPROVED}">
                                    <button type="button" class="btn btn-success btn-sm">APPROVED</button>
                                </td>
                                <td th:if="${data.status == data.status.REJECTED}">
                                    <button type="button" class="btn btn-danger btn-sm">REJECTED</button>
                                </td>
                                <td>

                                    <a th:href="@{/studiesActivity/krs/approval/form(krsApproval = ${data.id})}" class="btn btn-info btn-sm text-white">
                                        <i class="fas fa-eye"></i> Detail
                                    </a>

                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer py-4">
                        <nav aria-label="...">
                            <ul class="pagination justify-content-end mb-0" sd:pagination="full">
                                <li class="disabled"><a href="#" aria-label="Previous"><span
                                        aria-hidden="true">&laquo;</span></a>
                                </li>
                                <li class="active"><a href="#">1 <span class="sr-only">(current)</span></a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
        <!-- Dark table -->


    </div>
</div>

<!--modal-->

</body>
</html>
