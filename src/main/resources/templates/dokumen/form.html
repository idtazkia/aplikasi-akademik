<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layoutadmin}">
<head>
    <meta charset="UTF-8">
    <title>List Dokumen</title>
</head>
<body>
<div layout:fragment="main">
    <div class="header bg-gradient-primary pb-8 pt-5 pt-md-8">
        <div class="container-fluid">
            <div class="header-body">
                <!-- Card stats -->
                <div class="row">
                    <div class="col-xl-12 col-lg-12">
                        <div class="card card-stats mb-4 mb-xl-0">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col">
                                        <h5 class="card-title text-uppercase text-muted mb-0">Form</h5>
                                        <span class="h2 font-weight-bold mb-0">Dokumen </span>
                                    </div>
                                    <div class="col-auto">
                                        <div class="icon icon-shape bg-gradient-blue text-white rounded-circle shadow">
                                            <i class="fas fa-calendar"></i>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid mt--7">
        <div class="row">

        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="card shadow small">
                    <form th:action="@{/dokumen/save}" method="post" th:object="${dokumen}" enctype="multipart/form-data">
                        <div class="card-header">
                            <div class="row align-items-center">
                                <div class="col">
                                    <h3 class="mb-0">Form Dokumen</h3>
                                </div>
                                <div class="col text-right">
                                    <a th:href="@{/dokumen}" class="btn btn-sm btn-default"><i class="fas fa-plus-circle"></i> Kembali</a>
                                </div>
                            </div>
                        </div>
                        <div class="card-body border-0">

                            <div class="form-group">
                                <label>Deskripsi</label>
                                <textarea class="form-control" name="deskripsi" th:field="*{deskripsi}"></textarea>
                            </div>

                            <div class="form-group">
                                <label>Start Date</label>
                                <input type="date" name="startDate" th:field="*{startDate}" class="form-control"  placeholder="ex : 12121">
                            </div>

                            <div class="form-group">
                                <label>End Date</label>
                                <input type="date" name="endDate" th:field="*{endDate}" class="form-control"  placeholder="ex : 12121">
                            </div>


<!--                            <div class="form-group">-->
<!--                                <label>File</label>-->
<!--                                <input type="file" name="fileUpload" id="fileUpload" class="form-control bg-transparent te" accept="image/jpeg,mage/jpg,image/gif,image/png,application/pdf,image/x-eps">-->
<!--                            </div>-->

                            <div class="form-group">
                                <label>File</label>
                                <input type="file" name="fileUpload" id="fileUpload" class="form-control bg-transparent te"
                                       accept=".jpeg,.jpg,.gif,.png,.pdf,.doc,.docx,.xls,.xlsx,.ppt">
                            </div>

                        </div>

                        <input type="hidden" name="id" th:field="*{id}">
                        <div class="card-footer">
                            <input type="submit" class="btn btn-primary pull-right btn-sm" value="Simpan">
                        </div>
                    </form>
                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>
