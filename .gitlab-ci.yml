cache:
 paths:
 - /root/.m2/repository

services:
  - mysql:5

variables:
  MYSQL_ROOT_PASSWORD: "yes"
  MYSQL_DATABASE: "db_simak"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql/db_simak?useSSL=false"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_DATASOURCE_PASSWORD: "yes"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
 - build
 - deploy

sonarcloud-check:
  image: maven:3-openjdk-17
  stage: build
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn verify sonar:sonar -Dsonar.projectKey=tazkia.ac.id_aplikasi-akademik
  only:
    - merge_requests
    - master
    - develop

maven-build:
 image: maven:3-jdk-11
 stage: build
 script:
 - mvn clean package -B -DskipTests
 artifacts:
     paths:
       - target/*.jar

deploy-to-production:
 image: debian:latest
 stage: deploy
 only:
    - /-RELEASE$/
 script:
  - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
  - eval $(ssh-agent -s)
  - ssh-add <(echo "$SSH_PRIVATE_KEY")
  - mkdir -p ~/.ssh
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - '[[ -f /.dockerenv ]] && ssh-keyscan -H "$SSH_HOSTNAME_PRODUCTION" > ~/.ssh/known_hosts'
  - scp target/*.jar root@$SSH_HOSTNAME_PRODUCTION:/var/lib/$CI_PROJECT_NAME/
  - ssh root@$SSH_HOSTNAME_PRODUCTION /var/lib/$CI_PROJECT_NAME/deploy.sh $CI_PROJECT_NAME-$CI_COMMIT_TAG.jar
